apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: danikohale/backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: db-secret

